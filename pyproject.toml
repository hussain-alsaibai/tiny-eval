[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-eval"
version = "0.1.0"
description = "Zero-dependency agent evaluation framework with regression tracking"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com"}]
keywords = ["ai", "agent", "evaluation", "benchmark", "regression", "testing", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-eval"
Repository = "https://github.com/hussain-alsaibai/tiny-eval"
Issues = "https://github.com/hussain-alsaibai/tiny-eval/issues"

[tool.setuptools]
py-modules = ["tiny_eval"]
