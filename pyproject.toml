[project]
name = "tiny-eval"
version = "0.1.0"
description = "Zero-dependency agent evaluation framework. Benchmark suites, grading rubrics, regression tracking."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Hussain Al-Saibai"}]
keywords = ["agent", "evaluation", "benchmark", "eval", "testing", "regression", "zero-dependency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-eval"
Repository = "https://github.com/hussain-alsaibai/tiny-eval"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_eval"]

[tool.pytest.ini_options]
testpaths = ["test_tiny_eval.py"]
